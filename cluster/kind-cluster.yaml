# Single-node kind cluster prepared for the NGINX Ingress controller.
# Ports 80/443 of the EC2 host are forwarded into the node.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: campus
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
