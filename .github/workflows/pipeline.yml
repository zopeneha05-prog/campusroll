# CampusRoll delivery pipeline (single job, mono-repo)
# On every push that touches app/: test -> build -> scan -> push to ECR (OIDC) -> bump image in k8s/deployment.yaml
# Argo CD watches k8s/ in this same repo and rolls out the new version.
name: CampusRoll Pipeline

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/pipeline.yml"
  workflow_dispatch:

permissions:
  id-token: write    # OIDC token for AWS
  contents: write    # lets GITHUB_TOKEN commit the new image tag to k8s/

concurrency:
  group: campusroll-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR_REPO: campusroll
  IMAGE_TAG: v${{ github.run_number }}

jobs:
  deliver:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit/API tests
        run: npm test

      - name: Debug OIDC (temporary)
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          python3 -c "import sys,base64,json;p=sys.argv[1].split('.')[1];p+='='*(-len(p)%4);d=json.loads(base64.urlsafe_b64decode(p));print('SUB =',d['sub']);print('AUD =',d['aud'])" "$TOKEN"
          ARN='${{ secrets.AWS_OIDC_ROLE_ARN }}'
          echo "ROLE = ${ARN#*:role/}"
          echo "ARN LENGTH = ${#ARN}"

      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          role-session-name: campusroll-gha-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${ECR_REPO}:${IMAGE_TAG}"
          docker build \
            --build-arg APP_VERSION="${IMAGE_TAG}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            -t "$IMAGE" .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV" 
          
      - name: Push image to ECR
        run: docker push "$IMAGE"

      - name: Update image in k8s/deployment.yaml
        working-directory: .
        run: |
          yq -i '.spec.template.spec.containers[0].image = strenv(IMAGE)' k8s/deployment.yaml
          git diff k8s/deployment.yaml

      - name: Commit manifest change
        working-directory: .
        run: |
          git config user.name  "campusroll-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "deploy: campusroll ${IMAGE_TAG} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Summary
        run: |
          echo "### Deployed CampusRoll ${IMAGE_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`${IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Argo CD will sync k8s/ within ~1 minute." >> "$GITHUB_STEP_SUMMARY"
