<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusRoll</title>
  <style>
    :root { --ink:#172033; --muted:#5b6478; --brand:#4338ca; --soft:#eef0ff; --line:#e3e6ee; --bg:#f6f7fb; --danger:#c0362c; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: "Segoe UI", system-ui, sans-serif; background:var(--bg); color:var(--ink); }
    .top { background:linear-gradient(120deg, #312e81, var(--brand)); color:#fff; padding:28px 16px 64px; }
    .wrap { max-width:1040px; margin:0 auto; }
    .top h1 { margin:0; font-size:26px; letter-spacing:.3px; }
    .top p { margin:6px 0 0; opacity:.85; }
    .stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:12px; margin-top:-44px; }
    .stat { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px; }
    .stat b { display:block; font-size:24px; }
    .stat span { color:var(--muted); font-size:13px; }
    .grid { display:grid; grid-template-columns: 1fr 2fr; gap:16px; margin:16px 0; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
    .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px; }
    h2 { margin:0 0 12px; font-size:17px; }
    label { display:block; font-size:12px; color:var(--muted); margin:8px 0 4px; }
    input, select, button { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-size:14px; font-family:inherit; }
    button { background:var(--brand); color:#fff; border:none; cursor:pointer; margin-top:12px; }
    .filters { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
    .filters input { flex:2 1 180px; } .filters select { flex:1 1 140px; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th, td { text-align:left; padding:9px 6px; border-bottom:1px solid var(--line); }
    th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; }
    .pill { background:var(--soft); color:var(--brand); border-radius:99px; padding:2px 8px; font-size:12px; white-space:nowrap; }
    .actions button { width:auto; margin:0 0 0 4px; padding:4px 8px; font-size:12px; }
    .actions .del { background:var(--danger); }
    .msg { font-size:13px; margin-top:8px; color:var(--danger); min-height:1em; }
    footer { text-align:center; color:var(--muted); font-size:12px; padding:20px; }
    code { background:#e9ebf3; padding:1px 6px; border-radius:4px; }
    .table-scroll { overflow-x:auto; }
  </style>
</head>
<body>
  <div class="top"><div class="wrap">
    <h1 id="title">CampusRoll</h1>
    <p id="banner">Student Information System</p>
  </div></div>

  <div class="wrap" style="padding:0 16px">
    <div class="stats" id="stats"></div>

    <div class="grid">
      <section class="card">
        <h2>Register student</h2>
        <form id="form">
          <label>Full name</label><input name="name" required>
          <label>Roll number</label><input name="rollNo" required placeholder="BCA23015">
          <label>Email</label><input name="email" type="email" required>
          <label>Department</label><select name="department" id="dept"></select>
          <label>Year</label>
          <select name="year"><option>1</option><option>2</option><option>3</option><option>4</option></select>
          <button type="submit">Add student</button>
          <div class="msg" id="msg"></div>
        </form>
      </section>

      <section class="card">
        <h2>Students</h2>
        <div class="filters">
          <input id="q" placeholder="Search name or roll no">
          <select id="filterDept"><option value="">All departments</option></select>
        </div>
        <div class="table-scroll">
          <table>
            <thead><tr><th>Roll no</th><th>Name</th><th>Dept</th><th>Year</th><th></th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </div>
  </div>

  <footer>Version <code id="version">-</code> &middot; pod <code id="pod">-</code></footer>

<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  async function loadInfo() {
    const info = await (await fetch('/api/info')).json();
    $('title').textContent = info.appName;
    $('banner').textContent = info.banner;
    $('version').textContent = info.version;
    $('pod').textContent = info.pod;
    const opts = info.departments.map((d) => `<option>${esc(d)}</option>`).join('');
    $('dept').innerHTML = opts;
    $('filterDept').innerHTML = '<option value="">All departments</option>' + opts;
  }

  async function loadStats() {
    const s = await (await fetch('/api/stats')).json();
    const cards = [['Total students', s.total], ...Object.entries(s.byDepartment)];
    $('stats').innerHTML = cards.map(([k, v]) => `<div class="stat"><b>${v}</b><span>${esc(k)}</span></div>`).join('');
  }

  async function loadStudents() {
    const params = new URLSearchParams({ q: $('q').value, department: $('filterDept').value });
    const list = await (await fetch('/api/students?' + params)).json();
    $('rows').innerHTML = list.length ? list.map((s) => `
      <tr>
        <td>${esc(s.rollNo)}</td><td>${esc(s.name)}<br><small style="color:#5b6478">${esc(s.email)}</small></td>
        <td><span class="pill">${esc(s.department)}</span></td><td>${s.year}</td>
        <td class="actions">
          ${s.year < 4 ? `<button onclick="promote(${s.id}, ${s.year})">Promote</button>` : ''}
          <button class="del" onclick="removeStudent(${s.id})">Delete</button>
        </td>
      </tr>`).join('') : '<tr><td colspan="5">No students found.</td></tr>';
  }

  const refresh = () => Promise.all([loadStats(), loadStudents()]);

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const body = Object.fromEntries(new FormData(e.target));
    const res = await fetch('/api/students', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (res.ok) { e.target.reset(); $('msg').textContent = ''; refresh(); }
    else { $('msg').textContent = (await res.json()).errors.join('; '); }
  });

  async function promote(id, year) {
    await fetch('/api/students/' + id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ year: year + 1 }) });
    refresh();
  }
  async function removeStudent(id) {
    await fetch('/api/students/' + id, { method: 'DELETE' });
    refresh();
  }

  $('q').addEventListener('input', loadStudents);
  $('filterDept').addEventListener('change', loadStudents);
  loadInfo().then(refresh);
</script>
</body>
</html>
